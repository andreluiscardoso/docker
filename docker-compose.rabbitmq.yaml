services:
  rabbitmq:
    image: rabbitmq:4.4.0-management
    hostname: rabbitmq
    restart: unless-stopped
    stop_grace_period: 120s

    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-admin}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD to a strong password}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST:-app}"

    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    configs:
      - source: rabbitmq_config
        target: /etc/rabbitmq/conf.d/20-custom.conf
      - source: rabbitmq_plugins
        target: /etc/rabbitmq/enabled_plugins

    mem_limit: 2g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity",
        ]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - rabbitmq_net

configs:
  rabbitmq_config:
    content: |
      listeners.tcp.default = 5672
      management.tcp.port = 15672
      vm_memory_high_watermark.absolute = 1Gi
      disk_free_limit.absolute = 2GB
      loopback_users.guest = true
      log.console = true
      log.console.level = info
      log.file = false

  rabbitmq_plugins:
    content: |
      [rabbitmq_management].

volumes:
  rabbitmq_data:

networks:
  rabbitmq_net:
    driver: bridge
