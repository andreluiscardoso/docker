services:
  redis:
    image: redis:8.10.3
    restart: unless-stopped
    stop_grace_period: 60s

    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - "${REDIS_PASSWORD:?Set REDIS_PASSWORD to a strong password}"

    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?Set REDIS_PASSWORD to a strong password}"

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    configs:
      - source: redis_config
        target: /usr/local/etc/redis/redis.conf

    mem_limit: 2g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    healthcheck:
      test: ["CMD-SHELL", 'test "$$(redis-cli --raw ping)" = "PONG"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - redis_net

configs:
  redis_config:
    content: |
      bind 0.0.0.0
      protected-mode yes
      port 6379
      daemonize no
      dir /data
      appendonly yes
      appendfsync everysec
      auto-aof-rewrite-percentage 100
      auto-aof-rewrite-min-size 64mb
      save 3600 1 300 100 60 10000
      dbfilename dump.rdb
      stop-writes-on-bgsave-error yes
      maxmemory 512mb
      maxmemory-policy noeviction
      tcp-keepalive 300
      timeout 0
      loglevel notice
      logfile ""

volumes:
  redis_data:

networks:
  redis_net:
    driver: bridge
